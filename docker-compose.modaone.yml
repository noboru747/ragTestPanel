# ModaOne ModelSpace override：讓 backend 的文字生成改走 OpenAI 相容 API
# 用法：
#   cp .env.modaone.example .env.modaone   # 填入 OPENAI_BASE_URL / OPENAI_API_KEY / OPENAI_MODEL
#   docker compose -f docker-compose.yml -f docker-compose.modaone.yml up -d backend
# 注意：embed / vision OCR 仍走 Ollama（ModaOne 無 embedding 端點）
services:
  backend:
    env_file:
      - .env.modaone
    environment:
      LLM_PROVIDER: openai
